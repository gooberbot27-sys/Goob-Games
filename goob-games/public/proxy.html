<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser · Goob Games</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/proxy.css">
<script src="/js/config.js"></script>
<script src="/js/core.js"></script>
</head>
<body data-page="proxy">
<div id="nav"></div>
<main class="container" style="padding-top:18px">
  <div class="browser">
    <form class="bar" id="form">
      <button type="button" class="btn ghost small" id="back" title="Back">←</button>
      <button type="button" class="btn ghost small" id="fwd" title="Forward">→</button>
      <button type="button" class="btn ghost small" id="reload" title="Reload">⟳</button>
      <input type="text" id="url" placeholder="Search or enter a URL" autocomplete="off" spellcheck="false">
      <button class="btn small">Go</button>
      <button type="button" class="btn ghost small" id="fs" title="Fullscreen">⛶</button>
    </form>
    <div class="shortbar">
      <div class="shortcuts" id="shortcuts"></div>
      <button type="button" class="btn ghost small" id="scEdit">✎ Edit</button>
    </div>
    <div class="view" id="view">
      <div class="splash" id="splash"><div><div style="font-size:2.4rem">🌐</div><b id="status">Starting proxy…</b><div class="muted" id="sub"></div></div></div>
    </div>
  </div>
</main>
<div class="sc-overlay" id="scOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="scTitle">
  <form class="sc-box" id="scForm" autocomplete="off">
    <h2 id="scTitle">Add shortcut</h2>
    <label class="field" for="scName">Name</label>
    <input type="text" id="scName" maxlength="24" placeholder="Optional. Uses the site name if empty">
    <label class="field" for="scUrl">Website</label>
    <input type="text" id="scUrl" placeholder="example.com" spellcheck="false">
    <div class="status bad" id="scError" hidden></div>
    <div class="row" style="margin-top:18px">
      <button class="btn" type="submit">Save</button>
      <button class="btn ghost" type="button" id="scCancel">Cancel</button>
      <button class="btn ghost" type="button" id="scDelete" style="margin-left:auto">Delete</button>
    </div>
  </form>
</div>
<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script src="/js/proxy.js"></script>
<script src="/js/shortcuts.js"></script>
</body></html>
