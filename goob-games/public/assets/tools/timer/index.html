<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer &amp; Stopwatch</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/core.js"></script>
<style>
  [hidden]{display:none!important}
  body{padding:20px;display:flex;justify-content:center;align-items:flex-start}
  .app{width:100%;max-width:440px;margin-top:10px}
  .time{font-size:3.6rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:10px 0 4px}
  .time.done{color:var(--accent);animation:blink .6s ease-in-out 6}
  .msg{text-align:center;min-height:1.5em;color:var(--accent);font-weight:700}
  .trow{display:flex;gap:12px;justify-content:center;margin-top:6px}
  .trow label{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
  .trow input{width:84px;text-align:center}
  @keyframes blink{50%{opacity:.25}}
  @media(prefers-reduced-motion:reduce){.time.done{animation:none}}
</style>
</head>
<body>
<div class="app panel">
  <div class="chips" style="margin-bottom:10px">
    <button class="chip on" data-mode="timer" type="button">Timer</button>
    <button class="chip" data-mode="stopwatch" type="button">Stopwatch</button>
  </div>
  <div class="time" id="tDisp">05:00</div>
  <div class="msg" id="tMsg"></div>
  <div id="tSetup">
    <div class="trow">
      <label>Min <input type="number" id="tMin" min="0" max="999" value="5"></label>
      <label>Sec <input type="number" id="tSec" min="0" max="59" value="0"></label>
    </div>
    <div class="chips" style="margin:12px 0 0;justify-content:center">
      <button class="chip" data-min="1" type="button">1 min</button>
      <button class="chip" data-min="5" type="button">5 min</button>
      <button class="chip" data-min="10" type="button">10 min</button>
      <button class="chip" data-min="25" type="button">25 min</button>
    </div>
  </div>
  <div class="row" style="margin-top:18px;justify-content:center">
    <button class="btn" id="tStart" type="button">Start</button>
    <button class="btn ghost" id="tReset" type="button">Reset</button>
  </div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const tDisp = $("#tDisp"), tMin = $("#tMin"), tSec = $("#tSec"), tStart = $("#tStart"), tReset = $("#tReset"), tSetup = $("#tSetup"), tMsg = $("#tMsg");
  const pad = (n) => String(n).padStart(2, "0");
  const fmtTimer = (ms) => { const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s % 60); };
  const fmtWatch = (ms) => { const t = Math.floor(ms / 100), s = Math.floor(t / 10); return pad(Math.floor(s / 60)) + ":" + pad(s % 60) + "." + (t % 10); };
  const setupMs = () => ((Math.max(0, +tMin.value || 0) * 60) + Math.min(59, Math.max(0, +tSec.value || 0))) * 1000;

  let mode = "timer", running = false, timeout = null, endAt = 0, remain = 0, startAt = 0, elapsed = 0, ctx = null;

  function show() {
    tDisp.textContent = mode === "timer"
      ? fmtTimer(running ? endAt - Date.now() : (remain || setupMs()))
      : fmtWatch(running ? Date.now() - startAt : elapsed);
  }
  function tick() {
    if (!running) return;
    if (mode === "timer" && endAt - Date.now() <= 0) return finish();
    show(); timeout = setTimeout(tick, 100);
  }
  function beep() {
    if (!ctx) return;
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.4;
      o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.start(t); o.stop(t + 0.32);
    }
  }
  function finish() {
    running = false; remain = 0; clearTimeout(timeout);
    tDisp.textContent = "00:00"; tDisp.classList.add("done"); tMsg.textContent = "⏰ Time's up!";
    tStart.textContent = "Start"; tSetup.hidden = false; beep();
  }
  function reset() {
    running = false; clearTimeout(timeout); remain = 0; elapsed = 0;
    tMsg.textContent = ""; tDisp.classList.remove("done");
    tSetup.hidden = mode !== "timer"; tStart.textContent = "Start"; show();
  }
  tStart.addEventListener("click", () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }   // created on a click so sound is allowed
    if (ctx && ctx.state === "suspended") ctx.resume();
    if (running) {                                   // pause
      running = false; clearTimeout(timeout);
      if (mode === "timer") remain = Math.max(0, endAt - Date.now()); else elapsed = Date.now() - startAt;
      tStart.textContent = "Resume"; return show();
    }
    tMsg.textContent = ""; tDisp.classList.remove("done");
    if (mode === "timer") { if (!remain) remain = setupMs(); if (!remain) return; endAt = Date.now() + remain; }
    else startAt = Date.now() - elapsed;
    running = true; tSetup.hidden = true; tStart.textContent = "Pause"; tick();
  });
  tReset.addEventListener("click", reset);
  [tMin, tSec].forEach((i) => i.addEventListener("input", () => { if (!running && !remain) show(); }));
  document.querySelectorAll("[data-min]").forEach((b) => b.addEventListener("click", () => { tMin.value = b.dataset.min; tSec.value = 0; if (!running) { remain = 0; show(); } }));
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("on", x === b));
    mode = b.dataset.mode; reset();
  }));
  show();
</script>
</body></html>
