<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movies · Goob Games</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/core.js"></script>
</head>
<body data-page="movies">
<div id="nav"></div>
<main class="container">
  <h1>Movies</h1>
  <div class="toolbar"><input class="grow" type="search" id="s" placeholder="Search films…" autocomplete="off"></div>
  <div class="chips" id="cats"></div>
  <div class="grid posters" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>
<div id="footer"></div>
<div class="player" id="player" hidden>
  <div class="pbar">
    <button class="btn ghost small" id="pClose">← Back</button><b id="pTitle"></b><span class="sp"></span>
    <button class="btn ghost small" id="pFs">⛶ Fullscreen</button>
  </div>
  <div id="pBody" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>
<script src="/js/movies.js"></script>
</body></html>
